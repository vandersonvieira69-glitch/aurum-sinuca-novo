<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurum Sinuca - FIX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1210;color:#f6f2e7;font-family:system-ui,sans-serif}
header{text-align:center;padding:18px;background:#142019;border-bottom:1px solid #34483c}
h1{margin:0;color:#e8bd62;letter-spacing:.06em}main{max-width:950px;margin:auto;padding:14px;display:grid;gap:14px}
.card{background:#18241f;border:1px solid #304238;border-radius:14px;padding:14px}
button,input{font:inherit;padding:10px;border-radius:8px}button{background:#e8bd62;border:0;font-weight:700;cursor:pointer}
input{background:#0d1712;color:white;border:1px solid #496252;min-width:0;flex:1}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hint{color:#c2cec5;font-size:14px;line-height:1.45}
canvas{display:block;width:100%;height:auto;border-radius:8px;touch-action:none;cursor:crosshair}
h2{font-size:19px;color:#e8bd62;margin-top:0}.code{font-size:28px;font-weight:900;letter-spacing:5px;color:#e8bd62}
.hidden{display:none}.status{overflow-wrap:anywhere}
</style>
</head>
<body>
<header><h1>AURUM SINUCA</h1><p class="hint">Treino gratuito • Sinuca no navegador</p></header>
<main>
<section class="card">
<div class="bar"><button id="reset">Nova partida</button><button id="help">Como jogar</button><span id="score" class="hint">Bolas encaçapadas: 0</span></div>
<p id="instructions" class="hint">Toque e arraste a partir da bola branca para mirar; solte para dar a tacada.</p>
<canvas id="table" width="900" height="500"></canvas><p id="power" class="hint">Força: —</p>
</section>
<section class="card"><h2>Sala online</h2>
<div class="bar"><input id="name" maxlength="40" value="Jogador 1"><button id="create">Criar sala</button></div>
<div id="created" class="status hidden"><p class="hint">Código da sua sala:</p><div id="roomCode" class="code"></div></div><hr style="border-color:#304238;margin:16px 0">
<div class="bar"><input id="joinName" value="Jogador 2"><input id="room" maxlength="8" placeholder="Código"><button id="join">Entrar</button></div>
<p id="online" class="hint">Modo treino local ativo. Online opcional.</p><p id="players" class="hint"></p>
</section>
</main>
<script>
// Socket.io opcional - não trava mais se não tiver
let s = null;
try { if(typeof io === 'function') s = io(); } catch(e){}

(() => {
  const c = document.getElementById('table'), x = c.getContext('2d'), W=900,H=500, rail=42, balls=[], pockets=[];
  let drag=false,p=null,moving=false,potted=0;
  const colors=['#f4d44b','#2467d5','#d9473f','#7d4eb2','#f18c32','#258b5a','#8c2734','#191919','#e9c94e','#376fc7','#dc5747','#9a6acb','#f5a044','#3c9d69'];

  function reset(){ balls.length=0; potted=0; balls.push({x:245,y:250,vx:0,vy:0,r:12,c:'#fff',cue:true});
    [[650,250],[680,225],[680,275],[710,200],[710,250],[710,300],[740,175],[740,225],[740,275],[740,325],[770,200],[770,250],[770,300],[800,225],[800,275]]
   .forEach((a,i)=>balls.push({x:a[0],y:a[1],vx:0,vy:0,r:12,c:colors[i]}));
    document.getElementById('score').textContent='Bolas encaçapadas: 0'; moving=false; draw();
  }
  function draw(){
    x.clearRect(0,0,W,H); x.fillStyle='#57321d'; x.fillRect(0,0,W,H);
    x.fillStyle='#b98242'; x.fillRect(18,18,W-36,H-36); x.fillStyle='#126b49'; x.fillRect(rail,rail,W-rail*2,H-rail*2);
    pockets.length=0; [[rail,rail],[W/2,rail],[W-rail,rail],[rail,H-rail],[W/2,H-rail],[W-rail,H-rail]].forEach(a=>pockets.push({x:a[0],y:a[1],r:26}));
    pockets.forEach(a=>{x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fillStyle='#080a09';x.fill()});
    balls.forEach(b=>{if(b.potted)return;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fillStyle=b.c;x.fill();x.strokeStyle='#111';x.lineWidth=1;x.stroke()});
    if(drag&&p){x.beginPath();x.moveTo(balls[0].x,balls[0].y);x.lineTo(p.x,p.y);x.setLineDash([7,5]);x.strokeStyle='#f3d28a';x.lineWidth=2;x.stroke();x.setLineDash([])}
  }
  function pos(e){let r=c.getBoundingClientRect(); let src=e.touches?e.touches[0]:e; return{x:(src.clientX-r.left)*W/r.width,y:(src.clientY-r.top)*H/r.height}}
  c.addEventListener('pointerdown',e=>{if(moving)return;drag=true;p=pos(e);c.setPointerCapture(e.pointerId)});
  c.addEventListener('pointermove',e=>{if(!drag)return;p=pos(e);let b=balls[0];let pw=Math.min(100,Math.round(Math.hypot(p.x-b.x,p.y-b.y)/2));document.getElementById('power').textContent='Força: '+pw+'%';draw()});
  c.addEventListener('pointerup',e=>{if(!drag)return;drag=false;p=pos(e);let b=balls[0],dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy);if(d>8){let v=Math.min(18,d/7);b.vx=dx/d*v;b.vy=dy/d*v;moving=true;animate()}document.getElementById('power').textContent='Força: —';draw()});
  function animate(){
    let active=false; balls.forEach((a,i)=>{if(a.potted)return;a.x+=a.vx;a.y+=a.vy;a.vx*=.986;a.vy*=.986;
      if(Math.abs(a.vx)+Math.abs(a.vy)>.08)active=true;else a.vx=a.vy=0;
      if(a.x<rail+a.r){a.x=rail+a.r;a.vx=Math.abs(a.vx)*.82}if(a.x>W-rail-a.r){a.x=W-rail-a.r;a.vx=-Math.abs(a.vx)*.82}
      if(a.y<rail+a.r){a.y=rail+a.r;a.vy=Math.abs(a.vy)*.82}if(a.y>H-rail-a.r){a.y=H-rail-a.r;a.vy=-Math.abs(a.vy)*.82}
      for(let j=i+1;j<balls.length;j++){let b=balls[j];if(b.potted)continue;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r;if(d>0&&d<min){let nx=dx/d,ny=dy/d,over=(min-d)/2;a.x-=nx*over;a.y-=ny*over;b.x+=nx*over;b.y+=ny*over;let rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(rel>0){a.vx-=rel*nx;a.vy-=rel*ny;b.vx+=rel*nx;b.vy+=rel*ny}}}
      for(let q of pockets)if(Math.hypot(a.x-q.x,a.y-q.y)<q.r-3){if(a.cue){a.x=245;a.y=250;a.vx=a.vy=0}else{a.potted=true;potted++;document.getElementById('score').textContent='Bolas encaçapadas: '+potted}break}
    }); draw(); if(active)requestAnimationFrame(animate);else moving=false;
  }
  document.getElementById('reset').onclick=reset;
  document.getElementById('help').onclick=()=>alert('Puxe a partir da bola branca e solte. Quanto mais longe puxar, mais forte!');
  reset();
})();
</script>
<script src="/socket.io/socket.io.js" onerror="console.log('Modo offline - sem socket')"></script>
</body></html>
